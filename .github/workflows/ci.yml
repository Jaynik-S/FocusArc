name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: focusarc_test
          POSTGRES_USER: focusarc_test
          POSTGRES_PASSWORD: focusarc_test
        options: >-
          --health-cmd "pg_isready -U focusarc_test -d focusarc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      APP_ENV: dev
      AUTH_MODE: local
      DATABASE_URL: postgresql+psycopg://focusarc_test:focusarc_test@localhost:5432/focusarc_test
      TEST_DATABASE_URL: postgresql+psycopg://focusarc_test:focusarc_test@localhost:5432/focusarc_test
      VITE_AUTH_MODE: personal
      VITE_API_BASE_URL: https://api.example.invalid/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Backend tests on disposable PostgreSQL
        working-directory: backend
        run: python -m pytest -ra
      - name: Migration rehearsal on separate empty database
        env:
          MIGRATION_DATABASE_URL: postgresql+psycopg://focusarc_test:focusarc_test@localhost:5432/focusarc_migration_test
          PGPASSWORD: focusarc_test
        run: |
          createdb -h localhost -U focusarc_test focusarc_migration_test
          cd backend
          alembic upgrade head
          alembic upgrade head
          alembic current
          alembic heads
          python ../scripts/check_migration.py
      - name: Deployment orchestration tests
        run: python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Build Linux API image
        run: docker build -t focusarc-api:ci ./backend
