name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character main commit SHA with successful CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: focusarc-production
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Verify successful CI and main ancestry before exposing production secrets
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.eventName === 'workflow_dispatch'
              ? context.payload.inputs.sha : context.payload.workflow_run.head_sha;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('A full commit SHA is required');
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${sha}...main`
            });
            if (!['ahead', 'identical'].includes(comparison.status)) {
              throw new Error('Commit is not an ancestor of main');
            }
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'ci.yml', head_sha: sha, status: 'success', per_page: 100
            });
            const tested = runs.some(run => run.head_sha === sha && run.head_branch === 'main'
              && ['push', 'workflow_dispatch'].includes(run.event)
              && run.head_repository.full_name === `${context.repo.owner}/${context.repo.repo}`);
            if (!tested) throw new Error('No successful main CI run for this exact commit');
            core.setOutput('sha', sha);

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked migration dependencies
        working-directory: backend
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps .
      - name: Validate release configuration
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PERSONAL_ACCESS_KEY: ${{ secrets.PERSONAL_ACCESS_KEY }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
        run: |
          python - <<'PY'
          import os
          names = ['MIGRATION_DATABASE_URL', 'RENDER_API_KEY', 'PERSONAL_ACCESS_KEY',
                   'RENDER_API_SERVICE_ID', 'RENDER_WEB_SERVICE_ID', 'PRODUCTION_API_URL', 'PRODUCTION_WEB_URL']
          missing = [name for name in names if not os.environ.get(name)]
          if missing: raise SystemExit('Missing release settings: ' + ', '.join(missing))
          PY
      - name: Migrate with direct owner credentials
        id: migrate
        working-directory: backend
        env:
          APP_ENV: dev
          AUTH_MODE: local
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic current
          python - <<'PY'
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          head = ScriptDirectory.from_config(Config('alembic.ini')).get_current_head()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'revision={head}\n')
          PY
      - name: Deploy exact backend commit and wait for live deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          TESTED_SHA: ${{ needs.verify.outputs.sha }}
        run: python scripts/deploy_render.py "$SERVICE_ID" "$TESTED_SHA"
      - name: Verify backend before deploying frontend
        env:
          PERSONAL_ACCESS_KEY: ${{ secrets.PERSONAL_ACCESS_KEY }}
          API_URL: ${{ vars.PRODUCTION_API_URL }}
          REVISION: ${{ steps.migrate.outputs.revision }}
        run: python scripts/smoke_deployment.py api "$API_URL" --revision "$REVISION" --owner jayy
      - name: Deploy exact frontend commit and wait for live deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          TESTED_SHA: ${{ needs.verify.outputs.sha }}
        run: python scripts/deploy_render.py "$SERVICE_ID" "$TESTED_SHA"
      - name: Verify static routes and assets
        env:
          WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
        run: python scripts/smoke_deployment.py web "$WEB_URL"
      - name: Record successful release
        env:
          TESTED_SHA: ${{ needs.verify.outputs.sha }}
          REVISION: ${{ steps.migrate.outputs.revision }}
        run: |
          # shellcheck disable=SC2016
          printf 'Verified commit: `%s`\n\nAlembic revision: `%s`\n' "$TESTED_SHA" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
